name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .

  tasks:
    # Every task must pass with the oracle and fail with the noop agent on a real virtual display.
    name: tasks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v5
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth openbox xdotool dbus python3-pil python3-tk gedit
      - name: Unit and integration tests
        env:
          LAB_X: "1"
        run: /usr/bin/python3 -m unittest discover -s tests -v
